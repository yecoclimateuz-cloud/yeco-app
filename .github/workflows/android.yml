name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Capacitor project
        run: |
          mkdir -p app/www && cd app
          npm init -y > /dev/null
          npm i @capacitor/core@6.1.2 @capacitor/cli@6.1.2 @capacitor/android@6.1.2 @capacitor/filesystem@6.0.1 @capacitor/share@6.0.2
          cp -r ../index.html ../config.js ../logo.png ../esma-logo.png ../icon-192.png ../icon-512.png ../manifest.json ../fonts www/
          cat > capacitor.config.json <<'JSON'
          {
            "appId": "uz.yecoclimate.boshqaruv",
            "appName": "YECO",
            "webDir": "www",
            "server": {
              "url": "https://yecoclimateuz-cloud.github.io/yeco-app/",
              "androidScheme": "https",
              "allowNavigation": ["yecoclimateuz-cloud.github.io", "*.supabase.co"]
            }
          }
          JSON
          npx cap add android
          npx cap sync android
          RES=android/app/src/main/res
          rm -rf $RES/mipmap-anydpi-v26
          for d in $RES/mipmap-*; do
            cp ../icon-192.png $d/ic_launcher.png
            cp ../icon-192.png $d/ic_launcher_round.png
            rm -f $d/ic_launcher_foreground.png
          done
          sed -i "s/versionCode 1/versionCode ${{ github.run_number }}/; s/versionName \"1.0\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          mkdir -p ~/.android && cp ../yeco-debug.keystore ~/.android/debug.keystore

      - name: Assemble APK
        working-directory: app/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
          cp app/build/outputs/apk/debug/app-debug.apk ../../YECO.apk

      - uses: actions/upload-artifact@v4
        with:
          name: YECO-apk
          path: YECO.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk -y --cleanup-tag || true
          gh release create apk YECO.apk --title "YECO Boshqaruv APK (1.${{ github.run_number }})" --notes "Android uchun o'rnatish fayli. Telefonda yuklab oling va o'rnating."
