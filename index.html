async function pbkdf(pass,saltHex){const k=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveBits"]);
  const salt=new Uint8Array(saltHex.match(/../g).map(h=>parseInt(h,16)));const b=await crypto.subtle.deriveBits({name:"PBKDF2",hash:"SHA-256",salt,iterations:150000},k,256);
  return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
const newSalt=()=>[...crypto.getRandomValues(new Uint8Array(16))].map(x=>x.toString(16).padStart(2,"0")).join("");
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}

function calc(line,idx,date=today(),fans={}){
  const [pid,bid,label]=PACKS[line][idx];const s=sett(date);const fanPct=s.fanPct??15;
  const pump=price(prod(pid),date),buf=bid?price(prod(bid),date):0;
  const fanItems=Object.entries(fans||{}).filter(([id,q])=>q>0&&prod(id)).map(([id,q])=>{const base=price(prod(id),date);const unit=base*(1+fanPct/100);return {id,name:prod(id).name,qty:q,base,unit,sum:unit*q}});
  const fanUsd=fanItems.reduce((a,f)=>a+f.sum,0);const fanCount=fanItems.reduce((a,f)=>a+f.qty,0);
  const packUsd=(pump+buf)*s.markup+s.extra;const totalUsd=packUsd+fanUsd;const uzs=totalUsd*s.rate;
  const pct=uzs*s.pct/100;const sub=Math.min(pct,s.cap);
  return {line,idx,label,pid,bid,pump,buf,markup:s.markup,extra:s.extra,rate:s.rate,pctV:s.pct,cap:s.cap,fanPct,fans:fanItems,fanUsd,fanCount,packUsd,totalUsd,uzs,pct,sub,capped:pct>s.cap,pay:uzs-sub,date}
}

const avatar=()=>`<button class="av" style="background:${ROLE_COLOR[state.me.role]}" onclick="go('profil')" aria-label="Profil">${esc(initials(state.me.name))}</button>`;
function hdr(title,sub,{backBtn=false,right=""}={}){
  return `<header class="hdr">${backBtn?`<button class="back" onclick="back()" aria-label="Orqaga">‹</button>`:""}<div style="flex:1;min-width:0">${sub?`<div class="sub">${esc(sub)}</div>`:""}<h1>${esc(title)}</h1></div>${right||(backBtn?"":avatar())}</header>`
}

/* ============ RENDER ============ */
function render(){
  const app=$("#app");
  if(!state.me){app.innerHTML=viewLogin();return}
  const top=state.stack[state.stack.length-1];
  let html="";
  if(top){html=VIEWS[top.view](top.arg)}else{html=TABS[state.tab]()}
  const ae=document.activeElement,fid=ae&&ae.id,sel=fid&&ae.selectionStart!=null?[ae.selectionStart,ae.selectionEnd]:null;
  const tabs=tabsFor(state.me.role);
  const badge={servis:cache.issues.filter(i=>i.status!=="hal"&&(isRole("usta")?i.ustaId===state.me.id:true)).length,
    paket:cache.orders.filter(o=>o.report?.status==="sent").length,
    mine:myOrders().filter(o=>o.stage!=="topshirildi").length};
  app.innerHTML=html+`<nav class="nav"><div class="nav-in">${tabs.map(([k,l,ic])=>`<button class="${state.tab===k&&!top?"on":""}" onclick="setTab('${k}')">${ic}<span>${l}</span>${badge[k]?`<span class="dot">${badge[k]}</span>`:""}</button>`).join("")}</div></nav>`;
  if(fid){const el=document.getElementById(fid);if(el){el.focus();if(sel)try{el.setSelectionRange(...sel)}catch(e){}}}
  afterRender.forEach(f=>f());afterRender.length=0;
}
const afterRender=[];

/* ---- Kirish ---- */
function viewLogin(){
  return `<div class="login">
  <img src="logo.png" alt="YECO Climate">
  <div class="tag-line">Subsidiya va servis boshqaruvi</div>
  <form id="lf" class="fld" style="gap:12px" onsubmit="doLogin(event)">
   <div class="fld"><label for="lg">Login</label><input class="inp" id="lg" autocomplete="username" autocapitalize="none" required></div>
   <div class="fld"><label for="pw">Parol</label><input class="inp" id="pw" type="password" autocomplete="current-password" required></div>
   <div id="lerr" class="err" hidden></div>
   <button class="btn" id="lbtn">Kirish</button>
  </form>
  <div style="margin-top:auto;text-align:center;font-size:11px;color:var(--faint)">Yeco Subsidiya · YECO CLIMATE</div></div>`
}
async function doLogin(e){
  e.preventDefault();const b=$("#lbtn");b.disabled=true;b.textContent="Tekshirilmoqda…";
  try{const u=await DB.login($("#lg").value,$("#pw").value);
    if(!u){$("#lerr").hidden=false;$("#lerr").textContent="Login yoki parol noto'g'ri";b.disabled=false;b.textContent="Kirish";return}
    state.me=u;ls("yeco_session",u.id);state.tab=tabsFor(u.role)[0][0];render()}
  catch(err){$("#lerr").hidden=false;$("#lerr").textContent="Server bilan aloqa yo'q. Internetni tekshiring.";b.disabled=false;b.textContent="Kirish"}
}
async function logout(){closeSheet();await DB.logout();state.me=null;ls("yeco_session","");state.stack=[];render()}

/* ---- buyurtma kartochkasi (ro'yxatda) ---- */
function orderCard(o){
  const d=deadlineInfo(o);
  const sub=o.report?.status==="sent"?' · <span class="c-g">hisobot yuborildi</span>':o.report?.status==="returned"?' · <span class="c-red">hisobot qaytarildi</span>':"";
  return `<div class="oc ${d.s}" onclick="go('order','${o.id}')" role="button" tabindex="0">
   <div class="l1"><span class="nm">${esc(o.client)}</span><span class="tag ${d.cls}">${d.txt}</span></div>
   <div class="ln">📍 ${esc(o.address)}</div>
   <div class="ln">${o.kadastr?"🏷 "+esc(o.kadastr)+" · ":""}${esc(equipText(o.calc))}</div>
   <div class="ln">Bosqich: <b style="color:var(--fg)">${stageName(o.stage)}</b> · ${o.ustaId?esc(uname(o.ustaId)):"usta biriktirilmagan"}${sub}</div>
   ${o.stage!=="topshirildi"?`<div class="bar"><i style="width:${d.pct}%;background:${d.late||d.urgent?(d.late?"var(--red)":"var(--amber)"):"var(--accent)"}"></i></div>`:""}
  </div>`
}
const activeOrders=()=>cache.orders.filter(o=>o.stage!=="topshirildi");
const sortOrders=a=>[...a].sort((x,y)=>(x.stage==="topshirildi")-(y.stage==="topshirildi")||x.deadline-y.deadline);
const myOrders=()=>cache.orders.filter(o=>o.ustaId===state.me.id);

/* ---- TABS ---- */

 },

 paket(){

   <div class="list">${waitDocs.length?waitDocs.map(o=>`<div class="row tap" onclick="go('order','${o.id}')"><div><div class="n">${esc(o.client)}</div><div class="m">Yo'q: ${DOCS.filter(([k])=>!o.docs?.[k]).map(d=>d[1]).join(", ")}</div></div>${(d=>`<span class="tag ${d.cls}">${d.txt}</span>`)(deadlineInfo(o))}</div>`).join(""):`<div class="empty">Hamma hujjatlar joyida</div>`}</div>

 mine(){
  const list=sortOrders(myOrders());const act=list.filter(o=>o.stage!=="topshirildi");
  const td=today();const todayL=act.filter(o=>o.plannedDate<=td),later=act.filter(o=>o.plannedDate>td);

function greet(){const h=new Date().getHours();return h<11?"Xayrli tong,":h<18?"Xayrli kun,":"Xayrli kech,"}
function issueAge(i){if(i.status==="hal")return `<span class="tag t-g">Hal bo'ldi</span>`;const d=Math.floor((Date.now()-i.createdAt)/DAY);return `<span class="tag ${d>=2?"t-red":d>=1?"t-am":"t-b"}">${d<1?"Bugun":d+" kun javobsiz"}</span>`}
function issueLevel(i){const d=(Date.now()-i.createdAt)/DAY;return d>=2?"s-red":d>=1?"s-am":"s-b"}
const zipName=o=>(o.client+(o.kadastr?"_"+o.kadastr:"")).replace(/[^\p{L}\p{N}]+/gu,"_");

/* ---- VIEWS ---- */

  const fanP=cache.products.filter(p=>p.cat==="Fankoyl");const fq=state.fans;const sel=fanP.filter(p=>fq[p.id]>0);
  const fp=sett().fanPct??15;
  return `<div class="chips">${Object.keys(PACKS).map(l=>`<button type="button" class="chip ${l===line?"on":""}" onclick="state.calcLine='${l}';state.calcIdx=0;render()">${l} · ${l==="R290"?"Hitachi":"Panasonic"}</button>`).join("")}</div>
   <div class="chips wrap">${PACKS[line].map((p,i)=>`<button type="button" class="chip ${i===idx?"on":""}" onclick="state.calcIdx=${i};render()">${p[2]}</button>`).join("")}</div>
   <div class="sec">Fankoyllar <span class="prog">narxlar ro'yxati +${fp}%</span></div>
   <div class="list">${sel.map(p=>fanRow(p,fq[p.id],fp)).join("")}
    <div class="row"><select class="inp" id="fanAdd" aria-label="Fankoyl qo'shish" style="padding:10px 12px"><option value="">＋ Fankoyl tanlang…</option>${fanP.filter(p=>!(fq[p.id]>0)).map(p=>`<option value="${p.id}">${esc(p.name)} · ${fmtUsd(price(p)*(1+fp/100))}</option>`).join("")}</select><button type="button" class="btn sm" onclick="addFan()">Qo'shish</button></div>
   </div>`
}
function fanRow(p,q,fp){return `<div class="row"><div><div class="n">${esc(p.name)}</div><div class="m">${fmtUsd(price(p)*(1+fp/100))} × ${q} = ${fmtUsd(price(p)*(1+fp/100)*q)}</div></div><div class="stepper"><button type="button" onclick="fanQ('${p.id}',-1)" aria-label="Kamaytirish">−</button><b>${q}</b><button type="button" onclick="fanQ('${p.id}',1)" aria-label="Ko'paytirish">+</button></div></div>`}
function addFan(){const v=$("#fanAdd").value;if(!v)return;state.fans[v]=(state.fans[v]||0)+1;render()}
function fanQ(id,d){state.fans[id]=Math.max(0,(state.fans[id]||0)+d);if(!state.fans[id])delete state.fans[id];render()}
const curCalc=()=>calc(state.calcLine,Math.min(state.calcIdx,PACKS[state.calcLine].length-1),today(),state.fans);
function sumCard(c){return `<div class="card">

function compress(file){return new Promise(res=>{if(!file.type.startsWith("image/")||file.size<400e3)return res(file);
  const img=new Image();img.onload=()=>{const m=1600,s=Math.min(1,m/Math.max(img.width,img.height));const c=document.createElement("canvas");c.width=img.width*s;c.height=img.height*s;c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>res(b||file),"image/jpeg",.82)};img.onerror=()=>res(file);img.src=URL.createObjectURL(file)})}

  toast("Yuklanmoqda…");
  try{for(const f of files){const b=await compress(f);const ext=(b.type.split("/")[1]||"bin").replace("quicktime","mov").replace("jpeg","jpg");
    const path=`${o.id}/${k}_${uid()}.${ext}`;await DB.putFile(path,b);mem[path]=b;o.report.items[k]=[...(o.report.items[k]||[]),path]}

const blobB64=b=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(String(r.result).split(",")[1]);r.onerror=rej;r.readAsDataURL(b)});
async function saveBlob(blob,name){
  if(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform()){
    try{const {Filesystem,Share}=Capacitor.Plugins;const w=await Filesystem.writeFile({path:name,data:await blobB64(blob),directory:"CACHE"});await Share.share({title:name,files:[w.uri]});return}
    catch(e){if(String(e&&e.message||e).toLowerCase().includes("cancel"))return;toast("Faylni ulashib bo'lmadi");return}}
  try{if(window.claude&&window.claude.use){const d=await window.claude.use("downloads");if(d){await d.save({filename:name,data:blob});return}}}catch(e){if(e&&e.code==="declined")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}

function moveSheet(type){sheet(`<h2>${type==="in"?"Kirim":"Chiqim"}</h2>
  <div class="fld"><label for="mp">Mahsulot</label><select class="inp" id="mp">${cache.products.map(p=>`<option value="${p.id}">${p.code} · ${esc(p.name)} (${p.qty})</option>`).join("")}</select></div>
  <div class="fld"><label for="mq">Soni</label><input class="inp" id="mq" type="number" min="1" value="1"></div>

  p.prices=p.prices.filter(x=>x.from!==from);p.prices.push({from,usd:v,by:state.me.id,at:Date.now()});p.min=+$("#pm").value;p.stock=$("#pst").checked;await DB.put("products",p);render();toast("Narx saqlandi")}
async function saveSettings(e){e.preventDefault();const s=cache.settings[0];const from=$("#s6").value;

async function saveKpCfg(e){e.preventDefault();const s=cache.settings[0];const n=+$("#q1").value;if(n<nextKpNo()&&cache.kps.some(k=>+k.number>=n)){toast("Bu raqam allaqachon ishlatilgan");return}

  x.fillStyle="#fff";x.fillRect(0,0,W,H);
  const logo=await new Promise(r=>{const i=new Image();i.onload=()=>r(i);i.onerror=()=>r(null);i.src="logo.png"});
  if(logo)x.drawImage(logo,(W-300)/2,40,300,300*logo.height/logo.width);
  const F="Inter, system-ui, sans-serif";let y=330;
  x.fillStyle="#14231a";x.font=`800 40px ${F}`;x.textAlign="center";x.fillText("Subsidiya hisob-kitobi",W/2,y);y+=44;
  x.font=`500 24px ${F}`;x.fillStyle="#627a6b";x.fillText(new Date().toLocaleDateString("ru-RU")+" · "+equipText(c),W/2,y);y+=60;
  const rows=[[prod(c.pid).name,fmtUsd(c.pump)],...(c.bid?[[prod(c.bid).name,fmtUsd(c.buf)]]:[]),["QQS va kutilmagan xarajatlar",fmtUsd(c.packUsd-c.pump-c.buf)],...c.fans.map(f=>[f.name+" × "+f.qty,fmtUsd(f.sum)]),["Jami narx",fmtUsd(c.totalUsd)],["Kurs",fmt(c.rate)+" so'm"],["Subsidiyasiz narx",fmt(c.uzs)+" so'm"],["Subsidiya "+(c.capped?"(maksimum)":"("+c.pctV+"%)"),"− "+fmt(c.sub)+" so'm"]];
  x.textAlign="left";for(const [a,b] of rows){x.font=`500 28px ${F}`;x.fillStyle="#627a6b";x.fillText(a,70,y);x.textAlign="right";x.font=`700 28px ${F}`;x.fillStyle=a.startsWith("Subsidiya ")?"#1f8f3c":"#14231a";x.fillText(b,W-70,y);x.textAlign="left";y+=24;x.fillStyle="#eef2ef";x.fillRect(70,y,W-140,2);y+=42}
  y+=10;x.fillStyle="#14231a";roundRect(x,60,y,W-120,170,28);x.fill();
  x.fillStyle="#cfe3d6";x.font=`500 26px ${F}`;x.fillText("Mijoz to'laydi",100,y+60);x.fillStyle="#5fd47c";x.font=`800 64px ${F}`;x.fillText(fmt(c.pay)+" so'm",100,y+135);
  y+=230;x.fillStyle="#627a6b";x.font=`500 24px ${F}`;x.textAlign="center";x.fillText("YECO CLIMATE · Kafolat 24 oy · "+esc(state.me.name),W/2,y);
  const blob=await new Promise(r=>cv.toBlob(r,"image/png"));const file=new File([blob],"YECO_subsidiya_"+c.line+"_"+c.label.replace(/\W+/g,"")+".png",{type:"image/png"});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"YECO subsidiya hisobi"});return}}catch(e){if(e.name==="AbortError")return}
  await saveBlob(blob,file.name);toast("Rasm tayyor")
}
function roundRect(x,a,b,w,h,r){x.beginPath();x.moveTo(a+r,b);x.arcTo(a+w,b,a+w,b+h,r);x.arcTo(a+w,b+h,a,b+h,r);x.arcTo(a,b+h,a,b,r);x.arcTo(a,b,a+w,b,r);x.closePath()}

const KP_PHONES=["+998 50 025 00 05"];
function loadScript(src){return new Promise((res,rej)=>{if(document.querySelector(`script[src="${src}"]`)){res();return}const s=document.createElement("script");s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
const kpNum=x=>{x=Math.round(x*100)/100;const i=Math.abs(x-Math.round(x))<1e-9;const s=i?String(Math.round(x)):x.toFixed(2);const [a,b]=s.split(".");return a.replace(/\B(?=(\d{3})+(?!\d))/g," ")+(b?"."+b:"")};
const kpUsd=x=>kpNum(x)+" $";
const kpCfg=()=>{const m=cache.settings[0]||{};return {start:m.kpStart||1,valid:m.kpValid||"7 kun amal qiladi",pay:m.kpPay||"100% oldindan, so'mda",extraLabel:m.kpExtraLabel||"Qo'shimcha xarajatlar"}};
function nextKpNo(){const n=Math.max(kpCfg().start-1,...cache.kps.map(k=>+k.number||0));return n+1}
function kpCalc(c){const pc=c.fanPct??15,m=1+pc/100;
  const items=[{id:c.pid,name:null,qty:1,unit:c.pump*m},...(c.bid?[{id:c.bid,qty:1,unit:c.buf*m}]:[]),...(c.fans||[]).map(f=>({id:f.id,qty:f.qty,unit:f.base*m}))];
  const totalUsd=items.reduce((a,i)=>a+i.unit*i.qty,0);const uzs=totalUsd*c.rate;const pct=uzs*c.pctV/100;const sub=Math.min(pct,c.cap);
  return {pc,items,totalUsd,uzs,pct,sub,capped:pct>c.cap,pay:uzs-sub}}
function kpData(k){
  const c=k.calc,cfg=kpCfg();const pp=prod(c.pid),bp=c.bid?prod(c.bid):null;
  const kw=(pp?.name.match(/(\d+)\s*kVt/)||[])[1]||"";const brand=c.line==="R290"?"Hitachi":"Panasonic";
  const K=kpCalc(c),m=1+K.pc/100;
  const groups=[{name:"Issiqlik nasosi",items:[{name:`Issiqlik nasosi ${c.line}, ${kw} kVt`,spec:`${brand} kompressori`,qty:1,unit:"dona",price:c.pump*m}]}];
  if(bp)groups.push({name:"Bufer idish",items:[{name:bp.name,spec:"zanglamaydigan po'lat",qty:1,unit:"dona",price:c.buf*m}]});
  if((c.fans||[]).length)groups.push({name:"Fankoyllar",items:c.fans.map(f=>({name:f.name,spec:"",qty:f.qty,unit:"dona",price:f.base*m}))});
  return {number:String(k.number).padStart(4,"0"),date:new Date(k.at).toLocaleDateString("ru-RU"),valid:cfg.valid,
    headline:"Issiqlik nasosi davlat subsidiyasi bilan",
    intro:[`${k.client}${k.address?", "+k.address:""} uchun ${c.line} ${kw} kVt issiqlik nasosli tizim.`,`Davlat subsidiyasi hisobga olingan, montaj YECO jamoasi tomonidan 5 kunda.`],
    groups,total:K.totalUsd,K,rate:c.rate,
    sum_rows:[["Jami summa",`${kpUsd(K.totalUsd)} = ${kpNum(K.uzs)} so'm`],[K.capped?`Subsidiya (maksimum ${kpNum(c.cap)} so'm)`:`Subsidiya (${c.pctV}%)`,`−${kpNum(K.sub)} so'm`]],
    total_title:"Mijoz to'laydi",total_big:kpNum(K.pay)+" so'm",
    total_breakdown:`Jami ${kpNum(K.uzs)} so'm − subsidiya ${kpNum(K.sub)} so'm`,
    total_note:`Subsidiya: jami summaning ${c.pctV}%, lekin ${kpNum(c.cap)} so'mdan oshmaydi`,
    bullets:[["Davlat subsidiyasi bilan arzonroq","hujjatlarni o'zimiz tayyorlaymiz"],["Gaz bosimiga bog'liq emas"],["O'z montaj jamoamiz, kafolat 24 oy"]],
    terms:[["Kafolat","24 oy, ishga tushirilgandan"],["Ombor","Andijon"],["To'lov",cfg.pay],["Montaj muddati","5 kun"]],
    cta_title:"Batafsil gaplashamizmi?",
    cta_lines:["Qo'ng'iroq qiling yoki Telegram'ga yozing, kun davomida javob beramiz.","Shourum: Toshkent, Jomiy bozori, Usta Shirin 118B · har kuni 09:00–18:00"],
    manager:"Sotuvchi: "+uname(k.by),phones:KP_PHONES,
    fineprint:[`Narxlar AQSH dollarida. To'lov so'mda, kurs ${kpNum(c.rate)} so'm (${dshort(c.date)} holatiga).`,"Telegram: t.me/yecoclimate_bot · kanal t.me/yeco_climate"]}
}

  txt(L+18,y-49,D.total_note,"Sans",fit(D.total_note,"Sans",8.4,room),MUTED);
  y-=BH+22;const COL2=L+(R-L)*0.53;
  txt(L,y,"BU YECHIM NIMA BERADI","Sans-B",7.8,MUTED);txt(COL2,y,"SHARTLAR","Sans-B",7.8,MUTED);
  let yb=y-16;for(const b of D.bullets){page.drawCircle({x:L+3,y:yb+3,size:2,color:GREEN});b.forEach((ln,i)=>txt(L+12,yb-i*11,ln,"Sans",fit(ln,"Sans",8.8,COL2-L-24)));yb-=11*b.length+5}
  let yt=y-18;for(const [kk,v] of D.terms){txt(COL2,yt,kk,"Sans",8.8,MUTED);rtxt(R,yt,v,"Sans-B",fit(v,"Sans-B",9,R-COL2-80));yt-=7;rule(yt,COL2);yt-=12}
  y=Math.min(yb,yt)-14;rule(y,L,R,INK,0.9);y-=20;
  txt(L,y,D.cta_title,"Sans-B",11.5);D.cta_lines.forEach((ln,i)=>txt(L,y-16-i*12,ln,"Sans",fit(ln,"Sans",8.8,(R-L)*0.68),MUTED));
  rtxt(R,y,D.manager,"Sans-B",fit(D.manager,"Sans-B",11.5,(R-L)*0.3));D.phones.forEach((ph,i)=>rtxt(R,y-16-i*13,ph,"Sans",9.6));
  y-=16+12*Math.max(D.cta_lines.length,D.phones.length)+16;for(const ln of D.fineprint){txt(L,y,ln,"Sans",7.2,MUTED);y-=9.5}
  const bytes=await doc.save();return new Blob([bytes],{type:"application/pdf"})
}
const kpFileName=k=>`KP_${String(k.number).padStart(4,"0")}_ESMA_${(k.client||"mijoz").replace(/[^\p{L}\p{N}]+/gu,"_")}.pdf`;
async function kpDeliver(k,btn){
  const old=btn?.textContent;if(btn){btn.disabled=true;btn.textContent="PDF tayyorlanmoqda…"}
  try{const blob=await kpPdf(k);const file=new File([blob],kpFileName(k),{type:"application/pdf"});
    let shared=false;try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"YECO KP №"+k.number});shared=true}}catch(e){if(e.name==="AbortError")shared=true}
    if(!shared)await saveBlob(blob,file.name);toast("KP №"+String(k.number).padStart(4,"0")+" tayyor")}
  catch(e){console.error(e);toast("PDF yaratilmadi: internetni tekshiring")}
  if(btn){btn.disabled=false;btn.textContent=old}
}
function kpSheet(){
  const d=state.draft||{};const c=curCalc();
  const K=kpCalc(c);
  sheet(`<h2>KP tayyorlash</h2><div class="prog">${esc(equipText(c))} · KP №${String(nextKpNo()).padStart(4,"0")}</div>
  <div class="card"><div class="kv"><span>Jami (narxlar ro'yxati +${K.pc}%)</span><b>${fmtUsd(K.totalUsd)} · ${fmt(K.uzs)} so'm</b></div><div class="kv"><span>Subsidiya${K.capped?" (maksimum)":` (${c.pctV}%)`}</span><b class="c-g">− ${fmt(K.sub)} so'm</b></div><div class="kv tot"><span>Mijoz to'laydi</span><b>${fmt(K.pay)} so'm</b></div></div>
  <div class="fld"><label for="k1">Mijoz ism familiyasi *</label><input class="inp" id="k1" value="${esc(d.f1||"")}"></div>
  <div class="fld"><label for="k2">Telefon</label><input class="inp" id="k2" type="tel" value="${esc(d.f2||"+998 ")}"></div>
  <div class="fld"><label for="k3">Manzil</label><input class="inp" id="k3" value="${esc(d.f4||"")}"></div>
  <div id="kerr" class="err" hidden>Mijoz ismini yozing</div>
  <button class="btn" id="kbtn" onclick="saveKp(this)">Saqlash va PDF olish</button>`);setTimeout(()=>$("#k1")?.focus(),50)}
async function saveKp(btn){
  const name=$("#k1").value.trim();if(!name){$("#kerr").hidden=false;return}
  const k={id:"k"+uid(),number:nextKpNo(),client:name,phone:$("#k2").value.trim(),address:$("#k3").value.trim(),calc:curCalc(),by:state.me.id,at:Date.now(),orderId:""};
  await DB.put("kps",k);state.draft=Object.assign(state.draft||{f3:"",f6:"",f7:new Date(Date.now()+2*DAY).toISOString().slice(0,10),f8:state.me.id},{f1:k.client,f2:k.phone||"+998 ",f4:k.address});
  await kpDeliver(k,btn);closeSheet();render()}
function kpList(){
  const mine=isRole("sotuv")?cache.kps.filter(k=>k.by===state.me.id):cache.kps;const list=[...mine].sort((a,b)=>b.at-a.at).slice(0,15);
  if(!isRole("ceo","sotuv","hujjat"))return "";
  return `<div class="sec">Saqlangan KPlar <span class="prog">${mine.length} ta</span></div><div class="list">${list.length?list.map(k=>`<div class="row tap" onclick="kpOpen('${k.id}')"><div><div class="n">№${String(k.number).padStart(4,"0")} · ${esc(k.client)}</div><div class="m">${esc(equipText(k.calc))} · ${dshort(k.at)} · ${esc(uname(k.by))}${k.orderId?" · <span class='c-g'>buyurtma bo'ldi</span>":""}</div></div><span class="tag t-g">${fmt(kpCalc(k.calc).pay)}</span></div>`).join(""):`<div class="empty">Hali KP yo'q. Kalkulyatorda "KP (PDF)" tugmasini bosing.</div>`}</div>`}
function kpOpen(id){const k=cache.kps.find(x=>x.id===id);if(!k)return;
  sheet(`<h2>KP №${String(k.number).padStart(4,"0")} · ${esc(k.client)}</h2>
  <div class="card"><div class="kv"><span>Uskuna</span><b>${esc(equipText(k.calc))}</b></div>${(K=>`<div class="kv"><span>Jami (narxlar ro'yxati +${K.pc}%)</span><b>${fmtUsd(K.totalUsd)}</b></div><div class="kv"><span>Subsidiya</span><b class="c-g">− ${fmt(K.sub)} so'm</b></div><div class="kv tot"><span>Mijoz to'laydi</span><b>${fmt(K.pay)} so'm</b></div>`)(kpCalc(k.calc))}<div class="kv"><span>Telefon</span><b>${esc(k.phone||"—")}</b></div><div class="kv"><span>Tuzdi</span><b>${esc(uname(k.by))} · ${dt(k.at)}</b></div></div>
  <button class="btn" onclick="kpDeliver(cache.kps.find(x=>x.id==='${k.id}'),this)">📄 PDF yuklab olish</button>
  ${isRole("ceo","sotuv")&&!k.orderId?`<button class="btn dark" onclick="kpToOrder('${k.id}')">→ Buyurtmaga aylantirish</button>`:""}
  ${k.orderId?`<button class="btn ghost" onclick="closeSheet();go('order','${k.orderId}')">Buyurtmani ochish</button>`:""}
  ${isRole("ceo")?`<button class="btn red" onclick="(async()=>{await DB.del('kps','${k.id}');closeSheet();render();toast('KP o\\'chirildi')})()">KPni o'chirish</button>`:""}`)}
function kpToOrder(id){const k=cache.kps.find(x=>x.id===id);closeSheet();
  state.calcLine=k.calc.line;state.calcIdx=k.calc.idx;state.fans={};(k.calc.fans||[]).forEach(f=>state.fans[f.id]=f.qty);
  state.kpLink=k.id;state.draft={f1:k.client,f2:k.phone||"+998 ",f3:"",f4:k.address||"",f6:"",f7:new Date(Date.now()+2*DAY).toISOString().slice(0,10),f8:k.by};openSub("new")}
async function orderKp(id,btn){const o=findO(id);let k=o.kpId&&cache.kps.find(x=>x.id===o.kpId);
  if(!k){k={id:"k"+uid(),number:nextKpNo(),client:o.client,phone:o.phone,address:o.address,calc:o.calc,by:o.sellerId||state.me.id,at:Date.now(),orderId:o.id};await DB.put("kps",k);o.kpId=k.id;log(o,"KP №"+String(k.number).padStart(4,"0")+" tayyorlandi");await DB.put("orders",o)}
  await kpDeliver(k,btn);render()}

(async function(){
  $("#app").innerHTML=`<div class="empty" style="padding-top:40vh">Yuklanmoqda…</div>`;
  try{await DB.init()}catch(e){$("#app").innerHTML=`<div class="login"><img src="logo.png" alt="YECO"><div class="err" style="text-align:center">Server bilan aloqa yo'q. Internetni tekshirib, sahifani yangilang.</div></div>`;return}
  if(DB.mode==="live"){state.me=await DB.session()}else{const sid=ls("yeco_session");state.me=sid?user(sid)||null:null}
  if(state.me)state.tab=tabsFor(state.me.role)[0][0];
  render();
  if(DB.mode==="live")document.addEventListener("visibilitychange",()=>{if(!document.hidden&&state.me)DB.loadAll().then(render).catch(()=>{})});
  if("serviceWorker" in navigator&&!window.Capacitor&&location.protocol==="https:"&&!location.hostname.endsWith("claude.ai")){navigator.serviceWorker.register("sw.js").catch(()=>{})}
  setInterval(()=>{if(state.me)liveRender()},60000);
})();
